<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Inter; font-weight: 700; src: url(../fonts/inter-latin-700-normal.woff2); }
@font-face { font-family: Inter; font-weight: 800; src: url(../fonts/inter-latin-800-normal.woff2); }
@font-face { font-family: Grotesk; font-weight: 700; src: url(../fonts/space-grotesk-latin-700-normal.woff2); }
/* Charte Brooze : ne jamais modifier ces valeurs */
:root { --papier:#EDEBE7; --carte:#F7F6F2; --studio:#D7D6D3; --encre:#100E0D; --encre-douce:#6B675F; --gris-ui:#8A8780;
        --cuivre:#C8834A; --cuivre-profond:#A16A38; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:#0B0908; }
body { font-family:Inter, sans-serif; -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision; }
#cadre { position:absolute; inset:0; overflow:hidden; z-index:0; isolation:isolate; }
.scene { position:absolute; inset:0; overflow:hidden; will-change:transform, opacity, clip-path; }
.fond { position:absolute; inset:-60px; }
.papier .fond { background:radial-gradient(120% 85% at 30% 18%, var(--carte) 0%, var(--papier) 55%, #E1DED8 100%); }
.studio .fond { background:radial-gradient(110% 80% at 50% 10%, #E4E3E0 0%, var(--studio) 60%, #C6C5C1 100%); }
.encre .fond { background:radial-gradient(85% 60% at 68% 14%, #2B2622 0%, #17130F 46%, #0A0807 100%); }
.encre .faisceau { position:absolute; width:1100px; height:1800px; top:-420px; right:-300px; transform:rotate(-17deg);
  background:radial-gradient(closest-side, rgba(237,235,231,.11), rgba(237,235,231,0)); }
.camera { position:absolute; inset:0; transform-origin:50% 48%; }
.contenu { position:absolute; left:96px; right:96px; top:220px; bottom:220px; display:flex; flex-direction:column; justify-content:center; }

.label { font-family:Grotesk; font-weight:700; font-size:38px; letter-spacing:.16em; text-transform:uppercase; color:var(--encre-douce); margin-bottom:36px; }
.encre .label { color:var(--gris-ui); }
.bloc { font-weight:800; letter-spacing:-.045em; line-height:1.0; color:var(--encre); text-wrap:balance; }
.encre .bloc { color:var(--papier); text-shadow:0 18px 48px rgba(0,0,0,.45); }
.mot { display:inline-block; overflow:hidden; vertical-align:top; padding:.04em .02em .16em; margin:-.04em .2em -.16em -.02em; }
.mot > span { display:inline-block; will-change:transform; }
.cuivre { color:var(--cuivre-profond); }
.encre .cuivre { color:var(--cuivre); }
.sous { font-weight:700; font-size:54px; line-height:1.25; letter-spacing:-.015em; color:var(--encre-douce); margin-top:44px; }
.encre .sous { color:#BDB8B0; }

/* Sous-titres : zone basse sûre (y 1350–1700), une ligne, mot actif plein */
/* appel à l'action en surimpression (la vidéo boucle : pas de carton de fin) */
#cta { position:absolute; z-index:11; left:0; right:0; top:1230px; display:none; flex-direction:column; align-items:center; gap:14px; pointer-events:none; }
#cta .pilule { padding:26px 44px; border-radius:999px; background:var(--papier); color:var(--encre); font-weight:800; font-size:48px; letter-spacing:-.02em; box-shadow:0 14px 50px rgba(16,14,13,.25); }
#cta .pseudo { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:30px; letter-spacing:.12em; color:var(--papier); text-shadow:0 2px 12px rgba(0,0,0,.5); }
#st { position:absolute; z-index:10; left:80px; right:80px; top:1430px; height:180px; display:flex; align-items:center; justify-content:center; pointer-events:none; }
#st .ligne { font-weight:800; font-size:62px; letter-spacing:-.025em; white-space:nowrap; padding:14px 30px; border-radius:22px; }
#st.clair .ligne { color:var(--encre); background:rgba(247,246,242,.82); box-shadow:0 10px 40px rgba(16,14,13,.12); }
#st.sombre .ligne { color:var(--papier); background:rgba(16,14,13,.55); box-shadow:0 10px 40px rgba(0,0,0,.35); }
#st .w { opacity:.42; display:inline-block; margin:0 .13em; }
#st .w.on { opacity:1; }

/* Téléphone dessiné (marques fictives) */
.tel { position:absolute; left:50%; top:50%; width:600px; height:1220px; margin:-610px 0 0 -300px; border-radius:86px;
  background:linear-gradient(145deg,#3a3633,#141110 40%,#25211e); padding:18px; box-shadow:0 60px 120px -30px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.08); }
.tel .ecran { position:relative; width:100%; height:100%; border-radius:70px; overflow:hidden; background:#F4F2EE; }
.tel .barre { position:absolute; top:0; left:0; right:0; height:86px; display:flex; justify-content:space-between; align-items:center; padding:20px 54px 0; font-weight:700; font-size:30px; color:#111; z-index:3; background:linear-gradient(#F4F2EE 70%, rgba(244,242,238,0)); }
.tel .ilot { position:absolute; top:22px; left:50%; width:170px; height:48px; margin-left:-85px; border-radius:30px; background:#0a0908; z-index:4; }
.tel .fil { position:absolute; left:0; right:0; top:0; will-change:transform; }
.tel .post { margin:0 26px 34px; }
.tel .tete { display:flex; align-items:center; gap:16px; padding:18px 4px; font-weight:700; font-size:28px; color:#222; }
.tel .avatar { width:58px; height:58px; border-radius:50%; }
.tel .visuel { height:520px; border-radius:26px; position:relative; overflow:hidden; }
.tel .visuel b { position:absolute; left:34px; bottom:30px; right:34px; font-weight:800; font-size:44px; letter-spacing:-.03em; line-height:1.05; color:rgba(255,255,255,.92); }
.tel .reflet { position:absolute; inset:0; border-radius:70px; background:linear-gradient(115deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 34%); z-index:5; pointer-events:none; }

.cartes { display:grid; gap:30px; }
.carte { border-radius:40px; padding:54px 58px; background:var(--carte); box-shadow:0 30px 70px -30px rgba(16,14,13,.3); }
.carte.sombre { background:linear-gradient(160deg,#231E1A,#0F0C0A); color:var(--papier); box-shadow:0 40px 80px -30px rgba(16,14,13,.6); }
.carte .label { font-size:34px; margin-bottom:22px; }
.carte .txt { font-weight:800; font-size:76px; letter-spacing:-.035em; line-height:1.04; text-wrap:balance; }
.carte.barre .txt { color:var(--gris-ui); text-decoration:line-through; text-decoration-thickness:6px; }

.anneau { position:relative; width:640px; height:640px; margin:0 auto; }
.anneau svg { position:absolute; inset:0; transform:rotate(-90deg); }
.anneau .val { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:220px; letter-spacing:-.06em; }

.liste .item { display:flex; gap:34px; align-items:flex-start; font-weight:800; font-size:72px; letter-spacing:-.035em; line-height:1.08; padding:40px 0; border-top:2px solid rgba(138,135,128,.3); }
.liste .puce { flex:0 0 auto; width:84px; height:84px; border-radius:50%; border:4px solid var(--gris-ui); display:grid; place-items:center; font-family:Grotesk; font-size:40px; color:var(--encre-douce); margin-top:4px; }
.liste .item.cle .puce { background:var(--cuivre); border-color:var(--cuivre); color:var(--encre); }

.fin .wordmark { font-family:Grotesk; font-weight:700; font-size:104px; letter-spacing:.42em; line-height:1; color:var(--papier); }
.fin .wordmark span { display:inline-block; }
.fin .prod { font-family:Grotesk; font-weight:700; font-size:40px; letter-spacing:.62em; color:var(--gris-ui); margin-top:26px; }
.fin .cta { display:inline-flex; align-self:flex-start; margin-top:110px; padding:36px 54px; border-radius:999px; background:var(--papier); color:var(--encre); font-weight:800; font-size:56px; letter-spacing:-.02em; }
.fin .pseudo { font-family:Grotesk; font-weight:700; font-size:42px; letter-spacing:.06em; color:var(--gris-ui); margin-top:40px; }
.clip img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }


/* Fiche technique interminable, photographies dessinées, mot barré */
.specs-zone { position:relative; height:640px; margin-top:50px; overflow:hidden; border-radius:40px; background:rgba(247,246,242,.85); box-shadow:0 30px 70px -30px rgba(16,14,13,.3); border:2px solid rgba(138,135,128,.25);
  -webkit-mask-image:linear-gradient(transparent 0, #000 12%, #000 88%, transparent 100%); mask-image:linear-gradient(transparent 0, #000 12%, #000 88%, transparent 100%); }
.specs-fil { position:absolute; left:0; right:0; top:0; will-change:transform; }
.specs-fil .ligne-spec { display:flex; align-items:center; justify-content:space-between; gap:40px; height:104px; padding:0 54px; border-bottom:2px solid rgba(138,135,128,.22); font-family:Grotesk; font-weight:700; font-size:40px; letter-spacing:.08em; text-transform:uppercase; color:var(--encre-douce); }
.specs-fil .ligne-spec i { display:block; height:18px; border-radius:9px; background:rgba(107,103,95,.35); }
.photos { position:relative; height:1000px; margin-top:40px; }
.photo { position:absolute; border-radius:34px; overflow:hidden; border:10px solid #F7F6F2; box-shadow:0 50px 90px -30px rgba(0,0,0,.7); will-change:transform; }
.photo svg { display:block; width:100%; height:100%; }
.mot .trait { position:absolute; left:0; right:0; top:54%; height:.085em; background:var(--encre); transform-origin:0 50%; transform:scaleX(0); border-radius:.05em; }
.encre .mot .trait { background:var(--papier); }

/* Plan réel (photo, rush, rendu photoréaliste) : plein cadre, caméra vivante, étalonnage */
.plan .fond { background:#0B0908; }
.plan .media { position:absolute; left:50%; top:50%; width:1080px; height:1920px; margin:-960px 0 0 -540px; object-fit:cover; will-change:transform; }
.plan .calque { position:absolute; left:50%; top:50%; width:1080px; height:1920px; margin:-960px 0 0 -540px; object-fit:cover; pointer-events:none; }
.plan .voile { position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to bottom, rgba(10,8,7,.35) 0%, rgba(10,8,7,0) 22%, rgba(10,8,7,0) 56%, rgba(10,8,7,.5) 76%, rgba(10,8,7,.62) 100%); }
/* un titre posé sur une image : le haut s'assombrit franchement pour qu'il se lise sur n'importe quel fond */
.plan .voile.titre { background:linear-gradient(to bottom, rgba(10,8,7,.72) 0%, rgba(10,8,7,.5) 24%, rgba(10,8,7,0) 46%, rgba(10,8,7,0) 56%, rgba(10,8,7,.5) 76%, rgba(10,8,7,.62) 100%); }
.plan .titre-plan { position:absolute; left:96px; right:96px; top:300px; }
.plan .titre-plan .bloc { color:var(--papier); text-shadow:0 6px 30px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.35); }
#st.image .ligne { color:#F7F6F2; background:none; box-shadow:none; padding:0; font-size:66px;
  text-shadow:0 4px 22px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.6); }
#st.image .w { opacity:.78; display:inline-block; margin:0 .13em; }
#st.image .w.on { opacity:1; }
#grain { position:absolute; z-index:11; inset:-64px; pointer-events:none; opacity:.075; mix-blend-mode:overlay; }
#vignette { position:absolute; z-index:12; inset:0; pointer-events:none; background:radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 60%, rgba(0,0,0,.22) 100%); }
</style>
</head>
<body>
<div id="cadre"></div>
<div id="st"><div class="ligne"></div></div>
<div id="cta"><div class="pilule"></div><div class="pseudo">@broozeproduction</div></div>
<canvas id="grain" width="1208" height="2048"></canvas>
<div id="vignette"></div>
<svg id="filtres" width="0" height="0" style="position:absolute"></svg>
<script>
// ============ Moteur Brooze : motion design déterministe, une image = rendre(t) ============
// Données : window.REEL = { fps, duree, mots:[{w,start,end,g}], scenes:[…], couverture? }
const R = { scenes: [], mots: [], fps: 30 };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const E = {   // courbes : jamais de linéaire à l'écran
  sortie: p => 1 - Math.pow(1 - p, 3),
  expo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  doux: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  entree: p => p * p * p,
  // ressort critiquement amorti : arrive vite, se pose sans rebond cartoon
  pose: p => 1 - (1 + 9 * p) * Math.exp(-9 * p),
};
const prog = (t, a, d) => clamp((t - a) / d);
// Ressort amorti (réponse à un échelon) : u = temps écoulé (s), f = fréquence propre (Hz), z = amortissement.
// z ≈ 0,75 : une arrivée vivante avec un dépassement à peine perceptible ; z = 1 : se pose sans dépasser.
function ressort(u, f = 2.2, z = .78) {
  if (u <= 0) return 0;
  const w = 2 * Math.PI * f;
  if (z >= 1) return 1 - (1 + w * u) * Math.exp(-w * u);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + z / Math.sqrt(1 - z * z) * Math.sin(wd * u));
}
// Hasard déterministe (même image à chaque rendu) et bruit lisse pour la caméra à l'épaule
const hasard = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const bruit = (t, s) => (Math.sin(t * 1.13 + s * 3.1) * .5 + Math.sin(t * 2.71 + s * 7.7) * .3 + Math.sin(t * 5.93 + s * 1.9) * .2);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// Typographie française : espace insécable avant ? ! : ; et après «
const fr = s => esc(s).replace(/\s*([?!:;»])/g, ' $1').replace(/«\s*/g, '« ');
const md = s => fr(s).replace(/\*(.+?)\*/g, '<span class="cuivre">$1</span>');
const AVANCE = .12;                 // le texte précède la voix de 0,12 s
const tMot = i => R.mots[i].start - AVANCE;

// ---------- grain de pellicule : bruit précalculé, décalé à chaque image ----------
const grain = document.getElementById('grain');
(() => { const c = grain.getContext('2d'), d = c.createImageData(grain.width, grain.height); let s = 7;
  for (let i = 0; i < d.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = s % 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  c.putImageData(d, 0, 0); })();

// ---------- types de scènes : construire(sc) → élément ; animer(sc, t, ctx) ----------
const T = {};

// Bloc de mots de la voix : chaque mot monte derrière son masque à l'instant où il est dit
function blocMots(sc, style = '') {
  const [a, b] = sc.mots; let h = `<div class="bloc" style="text-align:${sc.align === 'centre' ? 'center' : 'left'};${style}">`;
  for (let i = a; i <= b; i++) {
    const cu = (sc.cuivre ?? []).includes(i) ? ' cuivre' : '';
    h += `<span class="mot${cu}" data-i="${i}"><span>${fr(R.mots[i].w)}</span></span>`;
  }
  return h + '</div>';
}
// Chaque mot arrive au ressort, avec de petites différences (retard, raideur, hauteur de départ) tirées d'un hasard
// déterministe : rien n'entre exactement comme le mot d'avant, c'est ce qui enlève l'effet « mécanique ».
function animerMots(el, t) {
  el.querySelectorAll('.mot').forEach(m => {
    const i = +m.dataset.i, inner = m.firstChild, h1 = hasard(i), h2 = hasard(i + 97);
    const u = t - (tMot(i) + (h1 - .5) * .05), p = ressort(u, 2.4 + h2 * .8, .8);
    const fort = m.classList.contains('cuivre');
    inner.style.transform = `translateY(${(1 - p) * (96 + h1 * 22)}%)` + (fort ? ` scale(${1 + .12 * (1 - ressort(u, 3.2, 1))})` : '');
    inner.style.opacity = u > 0 ? Math.min(1, u / .06) : 0;
  });
}

// Typo cinétique : les mots [a..b] de la voix apparaissent au moment où ils sont dits
T.texte = {
  construire(sc) {
    return (sc.label ? `<div class="label">${esc(sc.label)}</div>` : '') + blocMots(sc) + (sc.sous ? `<div class="sous">${md(sc.sous)}</div>` : '');
  },
  apres(el, sc) { ajusterBloc(el.querySelector('.bloc'), sc.taille ?? 150, sc.hauteur ?? 1000); },
  animer(el, sc, t) {
    animerMots(el, t);
    const s = el.querySelector('.sous'); if (s) { const p = E.sortie(prog(t, sc.t_sous ?? sc.de + .4, .5)); s.style.opacity = p; s.style.transform = `translateY(${(1 - p) * 26}px)`; }
  },
  montre: sc => range(sc.mots),
};

// Un mot (ou quelques mots) frappé énorme à l'instant où il est dit
T.slam = {
  construire(sc) {
    const txt = sc.texte ?? range(sc.mots).map(i => R.mots[i].w).join(' ');
    return (sc.label ? `<div class="label" style="text-align:center">${esc(sc.label)}</div>` : '') +
      `<div class="bloc" style="text-align:center"><span class="frappe">${md(txt)}</span></div>` + (sc.sous ? `<div class="sous" style="text-align:center">${md(sc.sous)}</div>` : '');
  },
  apres(el, sc) { ajusterBloc(el.querySelector('.bloc'), sc.taille ?? 260, sc.hauteur ?? 700); },
  animer(el, sc, t) {
    const t0 = sc.t ?? (sc.mots ? tMot(sc.mots[0]) : sc.de), f = el.querySelector('.frappe');
    const p = prog(t, t0, .16);
    f.style.display = 'inline-block';
    f.style.opacity = t >= t0 ? 1 : 0;
    f.style.transform = `scale(${1 + .22 * (1 - E.sortie(p))})`;
    const s = el.querySelector('.sous'); if (s) { const q = E.sortie(prog(t, sc.t_sous ?? t0 + .5, .5)); s.style.opacity = q; s.style.transform = `translateY(${(1 - q) * 26}px)`; }
  },
  impact: sc => sc.t ?? (sc.mots ? tMot(sc.mots[0]) : sc.de),
  montre: sc => sc.mots ? range(sc.mots) : [],
};

// Téléphone : un fil de posts qui défile sous le pouce, puis s'arrête (ou non)
T.telephone = {
  construire(sc) {
    // Une vraie interface le temps d'un plan (couleurs de photo permises), marques fictives uniquement
    const posts = sc.posts ?? [
      { compte: 'aube.cafe', titre: 'Nouvelle carte d\'automne', fond: '#6E4A33', assiette: ['#F2E6D2', '#C98B4E'], j: '128' },
      { compte: 'maison_valmond', titre: 'Découvrez nos offres', fond: '#3F4A3C', assiette: ['#E9E2D3', '#8C9A5B'], j: '64' },
      { compte: 'le_comptoir_k', titre: 'Venez nombreux !', fond: '#7A3E2E', assiette: ['#F4E9DA', '#D9A35E'], j: '37' },
      { compte: 'nexora.studio', titre: 'Bienvenue sur notre page', fond: '#2E3440', assiette: ['#E6E3DC', '#9AA5B1'], j: '212' }];
    const icones = `<svg width="210" height="44" viewBox="0 0 210 44" fill="none" stroke="#222" stroke-width="3.2" stroke-linejoin="round"><path d="M22 38s-16-9.5-16-21a9 9 0 0 1 16-5 9 9 0 0 1 16 5c0 11.5-16 21-16 21z"/><path d="M78 36l-4 6 1-8a16 16 0 1 1 3 2z"/><path d="M118 8l32 13-32 13 6-13z"/></svg>`;
    let fil = '';
    for (let k = 0; k < 6; k++) for (const p of posts) fil += `<div class="post"><div class="tete"><div class="avatar" style="background:${p.assiette[1]}"></div>${esc(p.compte)}</div>
      <div class="visuel" style="background:radial-gradient(60% 50% at 30% 25%, rgba(255,255,255,.18), rgba(255,255,255,0)), ${p.fond}">
        <div style="position:absolute;left:50%;top:44%;width:330px;height:330px;margin:-165px;border-radius:50%;background:radial-gradient(circle at 42% 38%, ${p.assiette[0]} 0 52%, ${p.assiette[1]} 53% 64%, ${p.assiette[0]} 65% 100%);box-shadow:0 30px 60px rgba(0,0,0,.35)"></div>
        <b>${esc(p.titre)}</b></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:18px 6px 0">${icones}<span style="font-weight:700;font-size:26px;color:#333">${p.j} J'aime</span></div></div>`;
    return `<div class="tel"><div class="ecran"><div class="ilot"></div><div class="barre"><span>9:41</span><span>●●● ▮</span></div><div class="fil">${fil}</div></div><div class="reflet"></div></div>` +
      (sc.mots ? `<div class="tel-titre" style="position:absolute;left:96px;right:96px;top:${sc.titre_y ?? 230}px">${sc.label ? `<div class="label">${esc(sc.label)}</div>` : ''}${blocMots(sc)}</div>` : '');
  },
  apres(el, sc) { if (sc.mots) ajusterBloc(el.querySelector('.tel-titre .bloc'), sc.taille ?? 130, sc.hauteur ?? 420); },
  montre: sc => range(sc.mots),
  animer(el, sc, t, ctx) {
    // Le pouce fait défiler à vitesse v0 (px/s). Sans `arret`, ça ne s'arrête jamais (« le pouce continue ») ;
    // avec `arret`, freinage sur 0,6 s qui se pose pile au début d'un post.
    const v0 = sc.vitesse ?? 2400, pas = sc._pas ??= el.querySelector('.post').offsetHeight + 34, dt = Math.max(0, t - sc.de);
    let y = v0 * dt, v = v0;
    if (sc.arret != null) {
      const tA = sc.arret - .6, yA = v0 * Math.max(0, tA - sc.de), fin = Math.ceil((yA + v0 * .3) / pas) * pas;
      if (t > tA) { const p = prog(t, tA, .6); y = yA + (fin - yA) * E.sortie(p); v = v0 * (1 - p) * (1 - p); }
    }
    el.querySelector('.fil').style.transform = `translateY(${-y}px)`;
    flou(el.querySelector('.fil'), `fil${sc.k}`, v > 300 ? Math.min(16, v / 170) : 0);
    animerMots(el, t);
    // le téléphone entre déjà en mouvement à la 1re image (jamais d'image qui s'installe)
    const tel = el.querySelector('.tel'), e = E.expo(prog(t, sc.de - .25, .7));
    tel.style.transform = `translateY(${(1 - e) * 260 + (sc.decalage_y ?? 0)}px) rotate(${(1 - e) * -5}deg) scale(${sc.echelle ?? 1})`;
  },
};

// Duel A / B : la mauvaise version barrée, la bonne dans la lumière
T.duel = {
  construire(sc) {
    return (sc.titre ? `<div class="bloc" style="font-size:96px;margin-bottom:56px">${md(sc.titre)}</div>` : '') + `<div class="cartes">
      <div class="carte barre a"><div class="label">${esc(sc.cA.label)}</div><div class="txt">${md(sc.cA.texte)}</div></div>
      <div class="carte sombre b"><div class="label" style="color:var(--gris-ui)">${esc(sc.cB.label)}</div><div class="txt">${md(sc.cB.texte)}</div></div></div>`;
  },
  animer(el, sc, t) {
    [['.a', sc.ta ?? sc.de + .1], ['.b', sc.tb ?? sc.de + .9]].forEach(([q, t0]) => {
      const c = el.querySelector(q), p = E.expo(prog(t, t0, .55)); c.style.opacity = p > 0 ? 1 : 0;
      c.style.transform = `translateY(${(1 - p) * 140}px)`; c.style.clipPath = `inset(${(1 - p) * 100}% 0 0 0 round 40px)`;
    });
  },
  impact: sc => sc.tb ?? sc.de + .9,
  montre: sc => range(sc.mots),
};

// Anneau de progression (chrono) : se remplit de `de_val` à `a_val`, le cuivre seulement quand c'est gagné
T.compteur = {
  construire(sc) {
    const r = 290, c = 2 * Math.PI * r;
    return (sc.label ? `<div class="label" style="text-align:center">${esc(sc.label)}</div>` : '') + `<div class="anneau"><svg viewBox="0 0 640 640">
      <circle cx="320" cy="320" r="${r}" fill="none" stroke="rgba(138,135,128,.28)" stroke-width="22"/>
      <circle class="arc" cx="320" cy="320" r="${r}" fill="none" stroke-width="22" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}"/></svg>
      <div class="val"></div></div>` + (sc.sous ? `<div class="sous" style="text-align:center">${md(sc.sous)}</div>` : '');
  },
  animer(el, sc, t) {
    const t0 = sc.t0 ?? sc.de + .2, t1 = sc.t1 ?? t0 + 1, p = E.doux(prog(t, t0, t1 - t0));
    const arc = el.querySelector('.arc'), c = 2 * Math.PI * 290;
    arc.setAttribute('stroke-dashoffset', c * (1 - p));
    const gagne = sc.cuivre_fin && p >= 1;
    arc.setAttribute('stroke', gagne ? 'var(--cuivre)' : (el.classList.contains('encre') ? 'var(--papier)' : 'var(--encre)'));
    const v = (sc.de_val ?? 0) + ((sc.a_val ?? 1) - (sc.de_val ?? 0)) * p;
    el.querySelector('.val').textContent = (sc.decimales ? v.toFixed(sc.decimales) : Math.round(v)) + (sc.unite ? ' ' + sc.unite : '');
    const s = el.querySelector('.sous'); if (s) { const q = E.sortie(prog(t, sc.t_sous ?? t1, .5)); s.style.opacity = q; }
  },
};

// Liste : chaque point arrive à son temps (souvent le mot qui le dit)
T.liste = {
  construire(sc) {
    return (sc.titre ? `<div class="bloc" style="font-size:110px;margin-bottom:40px">${md(sc.titre)}</div>` : '') + '<div class="liste">' +
      sc.items.map((it, k) => `<div class="item${it.cle ? ' cle' : ''}"><span class="puce">${k + 1}</span><span>${md(it.texte)}</span></div>`).join('') + '</div>';
  },
  animer(el, sc, t) {
    el.querySelectorAll('.item').forEach((it, k) => {
      const d = sc.items[k], t0 = d.t ?? (d.mot != null ? tMot(d.mot) : sc.de + .3 + k * .5), p = E.expo(prog(t, t0, .5));
      it.style.opacity = p > 0 ? 1 : 0; it.style.transform = `translateX(${(1 - p) * -60}px)`; it.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`;
    });
  },
};

// Fin : wordmark + appel à l'action (le vrai logo seulement s'il est fourni)
T.fin = {
  construire(sc) {
    return (sc.mots ? blocMots(sc, 'margin-bottom:110px') : '') +
      `<div class="wordmark">${[...'BROOZE'].map(c => `<span>${c}</span>`).join('')}</div><div class="prod">PRODUCTION</div>
      <div class="cta">${esc(sc.cta ?? 'Envoie-nous un message')} →</div><div class="pseudo">@broozeproduction</div>`;
  },
  animer(el, sc, t) {
    const t0 = sc.t_logo ?? sc.de + .2;
    el.querySelectorAll('.wordmark span').forEach((s, k) => { const p = E.expo(prog(t, t0 + k * .05, .5)); s.style.opacity = p; s.style.transform = `translateY(${(1 - p) * 50}px)`; s.style.filter = `blur(${(1 - p) * 10}px)`; });
    const q = E.expo(prog(t, t0 + .35, .5)); el.querySelector('.prod').style.opacity = q;
    const c = E.expo(prog(t, t0 + .6, .55)); const cta = el.querySelector('.cta'); cta.style.opacity = c; cta.style.transform = `translateY(${(1 - c) * 40}px)`;
    el.querySelector('.pseudo').style.opacity = E.sortie(prog(t, t0 + .85, .5));
    animerMots(el, t);
  },
  apres(el, sc) { if (sc.mots) ajusterBloc(el.querySelector('.bloc'), sc.taille ?? 104, 420); },
  montre: sc => range(sc.mots),
};

// Clip : séquence d'images précalculée (rendu 3D monde3d, ou autre), avec texte optionnel par-dessus
T.clip = {
  construire(sc) { return `<img class="img">` + (sc.titre ? `<div class="bloc" style="position:absolute;left:96px;right:96px;top:${sc.titre_y ?? 300}px;font-size:${sc.taille ?? 120}px">${md(sc.titre)}</div>` : ''); },
  async charger(el, sc, t) {
    const n = clamp(Math.floor((t - sc.de) * R.fps) + 1, 1, sc.n_images);
    const img = el.querySelector('.img'), src = `${sc.dossier}/${String(n).padStart(5, '0')}.jpg`;
    if (img.dataset.src !== src) { img.src = src; img.dataset.src = src; await img.decode().catch(() => {}); }
  },
  animer(el, sc, t) { const b = el.querySelector('.bloc'); if (b) { const p = E.expo(prog(t, sc.t_titre ?? sc.de + .2, .5)); b.style.opacity = p; b.style.transform = `translateY(${(1 - p) * 50}px)`; } },
};

// Son : une onde de voix vivante, qui s'écrase à `t_coupe` (le haut-parleur se barre)
T.son = {
  construire(sc) {
    const n = 34; let barres = '';
    for (let k = 0; k < n; k++) barres += `<i style="position:absolute;bottom:0;left:${k * 26}px;width:14px;border-radius:7px;background:currentColor"></i>`;
    return (sc.mots ? blocMots(sc, 'margin-bottom:120px') : '') + `<div class="onde" style="position:relative;height:300px;width:${n * 26 - 12}px;margin:0 auto">${barres}</div>
      <svg class="hp" viewBox="0 0 120 100" style="display:block;width:150px;margin:90px auto 0" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 38h18l26-20v64L32 62H14z"/><path class="vague" d="M76 34c8 9 8 23 0 32M88 24c14 15 14 37 0 52"/><path class="barre" d="M70 30l40 40"/></svg>`;
  },
  apres(el, sc) { if (sc.mots) ajusterBloc(el.querySelector('.bloc'), sc.taille ?? 130, 520); },
  animer(el, sc, t) {
    animerMots(el, t);
    const tc = sc.t_coupe ?? sc.a - .3, chute = E.expo(prog(t, tc, .35));
    el.querySelectorAll('.onde i').forEach((b, k) => {
      // amplitude pseudo-vocale déterministe : syllabes (≈ 5 Hz) modulées par des formants
      const a = .5 + .5 * Math.sin(t * 31 + k * .55) * Math.sin(t * 7.3 + k * .21) + .25 * Math.sin(t * 53 + k * 1.7);
      const h = 22 + 260 * clamp(Math.abs(a)) * (.35 + .65 * Math.sin(Math.PI * (k + .5) / 34));
      b.style.height = `${h * (1 - chute) + 10 * chute}px`; b.style.bottom = `${(300 - (h * (1 - chute) + 10 * chute)) / 2}px`;
      b.style.opacity = .9 - .5 * chute;
    });
    el.querySelector('.vague').style.opacity = 1 - chute;
    const barre = el.querySelector('.barre'); barre.style.strokeDasharray = 57; barre.style.strokeDashoffset = 57 * (1 - E.expo(prog(t, tc + .05, .3)));
  },
  impact: sc => sc.t_coupe,
  montre: sc => range(sc.mots),
};

// Montage : des rushs épars (ce que tu as déjà) se rangent sur une timeline, puis la tête de lecture passe
T.montage = {
  construire(sc) {
    const c = sc.clips ?? [['#6E4A33', '#C98B4E'], ['#3F4A3C', '#8C9A5B'], ['#7A3E2E', '#D9A35E'], ['#2E3440', '#9AA5B1'], ['#5B4636', '#E0B07A']];
    const rush = c.map((p, k) => `<div class="rush" style="position:absolute;left:0;top:0;width:168px;height:300px;border-radius:22px;overflow:hidden;
      background:radial-gradient(circle at 50% 42%, #F2E6D2 0 22%, ${p[1]} 23% 30%, rgba(0,0,0,0) 31%), ${p[0]};box-shadow:0 24px 50px -18px rgba(0,0,0,.55)">
      <span style="position:absolute;left:14px;bottom:12px;font-family:Grotesk;font-weight:700;font-size:34px;color:rgba(255,255,255,.9)">${String(k + 1).padStart(2, '0')}</span></div>`).join('');
    return (sc.mots ? blocMots(sc, 'margin-bottom:90px') : '') + `<div class="table" style="position:relative;height:640px">
      <div class="piste" style="position:absolute;left:0;right:0;top:300px;height:340px;border-radius:30px;background:rgba(16,14,13,.06);border:2px solid rgba(138,135,128,.3)"></div>
      ${rush}<div class="tete" style="position:absolute;top:280px;width:6px;height:380px;border-radius:3px;background:var(--encre)"></div></div>`;
  },
  apres(el, sc) { if (sc.mots) ajusterBloc(el.querySelector('.bloc'), sc.taille ?? 140, 520); },
  animer(el, sc, t) {
    animerMots(el, t);
    const t0 = sc.t_range ?? sc.de + .4, n = el.querySelectorAll('.rush').length;
    // positions éparses (galerie en vrac) → alignées sur la piste, avec un léger chevauchement d'arrivée
    const vrac = [[40, 0, -9], [330, 40, 6], [610, -10, -4], [180, 150, 11], [470, 170, -7]];
    el.querySelectorAll('.rush').forEach((r, k) => {
      const p = E.expo(prog(t, t0 + k * .09, .55)), [x0, y0, a0] = vrac[k % vrac.length];
      const x1 = 12 + k * 176, y1 = 320;
      r.style.transform = `translate(${x0 + (x1 - x0) * p}px, ${y0 + (y1 - y0) * p}px) rotate(${a0 * (1 - p)}deg) scale(${1 - .06 * (1 - p)})`;
    });
    const tl = t0 + n * .09 + .45, q = E.doux(prog(t, tl, (sc.a - .2) - tl));
    const tete = el.querySelector('.tete'); tete.style.left = `${8 + q * (n * 176 - 4)}px`; tete.style.opacity = t > tl ? 1 : 0;
  },
  montre: sc => range(sc.mots),
};


// Fiche technique : une liste de caractéristiques qui défile sans jamais finir (sans aucun chiffre)
T.specs = {
  construire(sc) {
    const noms = sc.lignes ?? ['Capteur', 'Ouverture', 'Stabilisation', 'Zoom optique', 'Processeur', 'Autonomie', 'Mémoire', 'Écran', 'Résolution', 'Fréquence', 'Objectif', 'Obturateur'];
    const larg = [260, 180, 330, 220, 290, 200, 340, 240, 190, 310, 230, 270];
    let fil = '';
    for (let k = 0; k < 8; k++) noms.forEach((n, j) => { fil += `<div class="ligne-spec"><span>${esc(n)}</span><i style="width:${larg[(j * 5 + k * 3) % larg.length]}px"></i></div>`; });
    return (sc.label ? `<div class="label">${esc(sc.label)}</div>` : '') + blocMots(sc) + `<div class="specs-zone"><div class="specs-fil">${fil}</div></div>`;
  },
  apres(el, sc) { ajusterBloc(el.querySelector('.bloc'), sc.taille ?? 118, sc.hauteur ?? 420); },
  animer(el, sc, t) {
    animerMots(el, t);
    const v = sc.vitesse ?? 1500, dt = Math.max(0, t - sc.de), fil = el.querySelector('.specs-fil');
    fil.style.transform = `translateY(${-(v * dt) % (12 * 104)}px)`;
    flou(fil, `spec${sc.k}`, Math.min(14, v / 170));
  },
  montre: sc => range(sc.mots),
};

// Photographies dessinées en code (jamais une vraie photo, jamais une vraie marque) qui arrivent une à une
const PAYSAGES = [
  `<svg viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E78A6"/><stop offset=".55" stop-color="#F0A86E"/><stop offset="1" stop-color="#F7D9A8"/></linearGradient></defs><rect width="400" height="520" fill="url(#g0)"/><circle cx="270" cy="300" r="62" fill="#FBE6B8"/><path d="M0 360 L90 250 L170 340 L250 230 L340 330 L400 290 V520 H0Z" fill="#46506E"/><path d="M0 430 L120 340 L210 420 L310 330 L400 400 V520 H0Z" fill="#2A3048"/></svg>`,
  `<svg viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141A33"/><stop offset="1" stop-color="#3C3A63"/></linearGradient></defs><rect width="400" height="520" fill="url(#g1)"/><circle cx="90" cy="110" r="34" fill="#F1E9D6"/><g fill="#0E1124"><rect x="20" y="300" width="70" height="220"/><rect x="100" y="250" width="60" height="270"/><rect x="170" y="330" width="80" height="190"/><rect x="260" y="230" width="62" height="290"/><rect x="330" y="310" width="70" height="210"/></g><g fill="#F3C879"><rect x="112" y="272" width="10" height="14"/><rect x="132" y="300" width="10" height="14"/><rect x="274" y="256" width="10" height="14"/><rect x="296" y="290" width="10" height="14"/><rect x="190" y="360" width="10" height="14"/><rect x="40" y="330" width="10" height="14"/><rect x="348" y="340" width="10" height="14"/></g></svg>`,
  `<svg viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9C9A0"/><stop offset=".5" stop-color="#F1E4CF"/><stop offset=".5" stop-color="#5C8DA0"/><stop offset="1" stop-color="#1F4D64"/></linearGradient></defs><rect width="400" height="520" fill="url(#g2)"/><ellipse cx="200" cy="260" rx="46" ry="46" fill="#F7B67C"/><g stroke="#EAF3F2" stroke-width="5" stroke-linecap="round" fill="none" opacity=".75"><path d="M30 330 q40 -16 80 0 t80 0 t80 0 t80 0"/><path d="M-10 390 q50 -20 100 0 t100 0 t100 0 t100 0"/><path d="M20 455 q60 -24 120 0 t120 0 t120 0"/></g></svg>`,
];
T.galerie = {
  construire(sc) {
    const cartes = (sc.photos ?? []).map((p, k) => `<div class="photo" data-k="${k}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px">${PAYSAGES[p.scene % PAYSAGES.length].replace(/id="g(\d)"/, `id="g$1_${sc.k}_${k}"`).replace(/url\(#g(\d)\)/, `url(#g$1_${sc.k}_${k})`)}</div>`).join('');
    return (sc.label ? `<div class="label">${esc(sc.label)}</div>` : '') + blocMots(sc) + `<div class="photos" style="height:${sc.hauteur_photos ?? 1000}px">${cartes}</div>`;
  },
  apres(el, sc) { ajusterBloc(el.querySelector('.bloc'), sc.taille ?? 118, sc.hauteur ?? 330); },
  animer(el, sc, t) {
    animerMots(el, t);
    el.querySelectorAll('.photo').forEach(c => {
      const p = sc.photos[+c.dataset.k], t0 = p.t ?? sc.de + .3 + c.dataset.k * .35, q = E.expo(prog(t, t0, .6)), derive = prog(t, t0, 3);
      c.style.opacity = q > 0 ? 1 : 0;
      c.style.transform = `translateY(${(1 - q) * 900 - derive * 22}px) rotate(${(p.rot ?? 0) * (.6 + .4 * q)}deg) scale(${1 + .03 * derive})`;
      if (sc.iris) c.style.clipPath = `circle(${q * 150}% at 50% 50%)`;
    });
  },
  montre: sc => range(sc.mots),
  impact: sc => sc.t_impact,
};

// Mot barré : le texte de la voix, et un trait d'encre qui raye les mots `raye` au temps `t_raye`
T.barre = {
  construire(sc) {
    let h = (sc.label ? `<div class="label">${esc(sc.label)}</div>` : '') + blocMots(sc);
    (sc.raye ?? []).forEach(i => { h = h.replace(`data-i="${i}">`, `data-i="${i}" style="position:relative">`).replace(new RegExp(`(data-i="${i}"[^>]*><span>[^<]*</span>)`), '$1<i class="trait"></i>'); });
    return h + (sc.sous ? `<div class="sous">${md(sc.sous)}</div>` : '');
  },
  apres(el, sc) { ajusterBloc(el.querySelector('.bloc'), sc.taille ?? 150, sc.hauteur ?? 1000); },
  animer(el, sc, t) {
    animerMots(el, t);
    const p = E.expo(prog(t, sc.t_raye, .28));
    el.querySelectorAll('.trait').forEach(x => { x.style.transform = `scaleX(${p})`; });
    el.querySelectorAll('.mot').forEach(m => { if ((sc.raye ?? []).includes(+m.dataset.i)) m.style.opacity = 1 - .55 * p; });
  },
  impact: sc => sc.t_raye,
  montre: sc => range(sc.mots),
};

// Plan réel : photo, rush vidéo (séquence d'images extraite par rendu.mjs) ou rendu photoréaliste.
// cadre : [[x, y, zoom] au début, [x, y, zoom] à la fin] (x, y = point visé de 0 à 1) ; calques : avant-plans détourés
// (PNG) qui bougent plus que le fond = parallaxe ; etalonnage : chaud | neutre | froid | nuit ; mots : titre optionnel.
const ETALON = { chaud: 'contrast(1.06) saturate(1.04) sepia(.08)', neutre: 'contrast(1.04)', froid: 'contrast(1.06) saturate(.92) hue-rotate(-6deg)',
  nuit: 'contrast(1.12) brightness(.86) saturate(.9)' };
T.plan = {
  construire(sc) {
    const media = sc.profondeur ? `<canvas class="media" width="1080" height="1920"></canvas>`
      : sc.video ? `<img class="media">` : `<img class="media" src="${sc.image}">`;
    const calques = (sc.calques ?? []).map((c, k) => `<img class="calque" data-k="${k}" src="${c.image}">`).join('');
    return media + calques + `<div class="voile${sc.mots ? ' titre' : ''}" style="opacity:${sc.voile ?? 1}"></div>` +
      (sc.mots ? `<div class="titre-plan" style="top:${sc.titre_y ?? 300}px">${blocMots(sc)}</div>` : '');
  },
  apres(el, sc) {
    if (sc.mots) ajusterBloc(el.querySelector('.bloc'), sc.taille ?? 150, sc.hauteur ?? 520);
    el.querySelector('.media').style.filter = ETALON[sc.etalonnage ?? 'chaud'] ?? sc.etalonnage;
  },
  async charger(el, sc, t) {
    if (sc.profondeur) return relief(el, sc);
    if (!sc.video) return;
    const n = clamp(Math.floor((t - sc.de) * R.fps) + 1, 1, sc.n_images);
    const img = el.querySelector('.media'), src = `${sc.dossier}/${String(n).padStart(5, '0')}.jpg`;
    if (img.dataset.src !== src) { img.src = src; img.dataset.src = src; await img.decode().catch(() => {}); }
  },
  animer(el, sc, t) {
    animerMots(el, t);
    const [c0, c1] = sc.cadre ?? [[.5, .5, 1.08], [.5, .46, 1.16]];
    const p = E.doux(prog(t, sc.de, (sc.a + .5) - sc.de));      // le mouvement continue pendant la transition de sortie
    const zx = c0[2] + (c1[2] - c0[2]) * p, fx = c0[0] + (c1[0] - c0[0]) * p, fy = c0[1] + (c1[1] - c0[1]) * p;
    // garder le cadre plein : le décalage ne dépasse jamais la marge que donne le zoom
    const mx = 540 * (zx - 1), my = 960 * (zx - 1);
    const dx = clamp((.5 - fx) * 1080 * zx, -mx, mx), dy = clamp((.5 - fy) * 1920 * zx, -my, my);
    el.querySelector('.media').style.transform = `translate(${dx}px, ${dy}px) scale(${zx})`;
    // relief (carte de profondeur) : un travelling latéral lent + la caméra à l'épaule déplacent le premier plan plus
    // que le fond ; `dolly` fait grandir le proche plus que le lointain sur une poussée. Faible par défaut : on doit
    // sentir le volume, pas voir l'effet.
    if (sc.profondeur) {
      const r = sc.relief ?? 1, [o0, o1] = sc.orbite ?? [[-.010, -.003], [.010, .003]];
      const hx = (sc.main ?? 1) * .0035 * bruit(t * .5, 11), hy = (sc.main ?? 1) * .0025 * bruit(t * .45, 12);
      sc._off = [r * (o0[0] + (o1[0] - o0[0]) * p + hx), r * (o0[1] + (o1[1] - o0[1]) * p + hy)];
      sc._dolly = r * (sc.dolly ?? .05) * p;
    }
    el.querySelectorAll('.calque').forEach(c => {
      const pr = sc.calques[+c.dataset.k].profondeur ?? 1.6;    // > 1 : plus proche, bouge plus
      c.style.transform = `translate(${dx * pr}px, ${dy * pr}px) scale(${1 + (zx - 1) * pr})`;
    });
  },
  impact: sc => sc.t_impact,
  montre: sc => range(sc.mots),
};

// ---------- relief 2,5D : image + carte de profondeur, déplacement par pixel en WebGL ----------
async function relief(el, sc) {
  const cv = el.querySelector('canvas.media');
  if (!sc._gl) {
    const gl = cv.getContext('webgl', { preserveDrawingBuffer: true, premultipliedAlpha: false });
    const charge = src => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
    const [img, dep] = await Promise.all([charge(sc.image), charge(sc.profondeur)]);
    // profondeur adoucie : les bords nets d'une carte de profondeur font des déchirures, des volumes doux font du vrai
    const tmp = document.createElement('canvas'); tmp.width = 540; tmp.height = 960; const c2 = tmp.getContext('2d');
    c2.filter = 'blur(5px)'; c2.drawImage(dep, 0, 0, 540, 960);
    const vs = 'attribute vec2 p; varying vec2 v; void main(){ v = p * .5 + .5; v.y = 1. - v.y; gl_Position = vec4(p, 0., 1.); }';
    const fs = `precision highp float; varying vec2 v; uniform sampler2D img, dep; uniform vec2 off; uniform float foc, dolly;
      void main(){ vec2 c = vec2(.5), uv = v; float d = 0.;
        for (int i = 0; i < 5; i++) { d = texture2D(dep, uv).r; uv = v - off * (d - foc); uv = c + (uv - c) / (1. + dolly * (d - foc)); }
        gl_FragColor = vec4(texture2D(img, clamp(uv, 0., 1.)).rgb, 1.); }`;
    const sh = (t, src) => { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
    const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const tex = (unit, source) => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, source); };
    tex(0, img); tex(1, tmp);
    gl.uniform1i(gl.getUniformLocation(pr, 'img'), 0); gl.uniform1i(gl.getUniformLocation(pr, 'dep'), 1);
    sc._gl = { gl, off: gl.getUniformLocation(pr, 'off'), foc: gl.getUniformLocation(pr, 'foc'), dolly: gl.getUniformLocation(pr, 'dolly') };
  }
  const { gl, off, foc, dolly } = sc._gl;
  gl.viewport(0, 0, 1080, 1920);
  gl.uniform2f(off, ...(sc._off ?? [0, 0])); gl.uniform1f(foc, sc.mise_au_point ?? .5); gl.uniform1f(dolly, sc._dolly ?? 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// Couverture : une image fixe, titre fort lisible en vignette
T.couverture = {
  construire(sc) { return (sc.label ? `<div class="label">${esc(sc.label)}</div>` : '') + `<div class="bloc">${md(sc.titre)}</div>` + (sc.sous ? `<div class="sous">${md(sc.sous)}</div>` : ''); },
  apres(el, sc) { ajusterBloc(el.querySelector('.bloc'), sc.taille ?? 190, 900); },
  animer() {},
};

// Flou de mouvement vertical : un filtre SVG par élément (un filtre partagé contaminerait les autres scènes)
function flou(el, id, px, axe = 'y') {
  let f = document.getElementById(id);
  if (!f) { document.getElementById('filtres').insertAdjacentHTML('beforeend', `<filter id="${id}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="0 0"/></filter>`); f = document.getElementById(id); }
  f.firstChild.setAttribute('stdDeviation', axe === 'x' ? `${px.toFixed(1)} 0` : `0 ${px.toFixed(1)}`);
  el.style.filter = px > .5 ? `url(#${id})` : 'none';
}
window.flou = flou;

function range(m) { if (!m) return []; const r = []; for (let i = m[0]; i <= m[1]; i++) r.push(i); return r; }

// Plus grande taille (≤ maxi) où le bloc tient en largeur ET en hauteur, sans couper un mot
function ajusterBloc(b, maxi, hMax) {
  for (let s = maxi; s >= 60; s -= 4) {
    b.style.fontSize = s + 'px';
    const trop = [...b.querySelectorAll('.mot, .frappe')].some(m => m.scrollWidth > b.clientWidth + 2) || b.scrollWidth > b.clientWidth + 2;
    if (!trop && b.scrollHeight <= hMax) return s;
  }
  return 60;
}

// ---------- transitions entre scènes ----------
const TR = {
  coupe: { d: 0 },
  // Poussée plein cadre : la scène suivante pousse la précédente vers le haut, les deux solidaires ; flou ∝ vitesse
  glisse: { d: .5, entree: (el, p) => { el.style.transform = `translateY(${(1 - E.expo(p)) * 1920}px)`; return Math.min(26, 46 * Math.pow(2, -10 * p)); },
            sortie: (el, p) => { el.style.transform = `translateY(${(1 - E.expo(p)) * 1920 - 1920}px)`; return Math.min(26, 46 * Math.pow(2, -10 * p)); } },
  // Zoom : l'ancienne scène part (0–45 %), la nouvelle arrive ensuite (35–100 %) : jamais deux textes superposés
  zoom: { d: .45, entree: (el, p) => { const q = prog(p, .35, .65); el.style.transform = `scale(${.9 + .1 * E.expo(q)})`; el.style.opacity = E.sortie(q); return 0; },
          sortie: (el, p) => { const q = prog(p, 0, .45); el.style.transform = `scale(${1 + .16 * E.entree(q)})`; el.style.opacity = 1 - E.sortie(q); return 0; } },
  // Panoramique filé : les deux plans solidaires filent à l'horizontale, flou de mouvement proportionnel à la vitesse
  whip: { d: .34, axe: 'x', entree: (el, p) => { el.style.transform = `translateX(${(1 - E.expo(p)) * 1080}px)`; return Math.min(40, 70 * Math.pow(2, -10 * p)); },
          sortie: (el, p) => { el.style.transform = `translateX(${(1 - E.expo(p)) * 1080 - 1080}px)`; return Math.min(40, 70 * Math.pow(2, -10 * p)); } },
  // Fondu court entre deux images réelles, le nouveau plan arrive en reculant légèrement (respiration naturelle)
  fondu: { d: .4, entree: (el, p) => { el.style.opacity = E.doux(p); el.style.transform = `scale(${1.035 - .035 * E.sortie(p)})`; return 0; }, sortie: () => 0 },
  volet: { d: .38, entree: (el, p) => { el.style.clipPath = `inset(${(1 - E.doux(p)) * 100}% 0 0 0)`; return 0; }, sortie: () => 0 },
};

// ---------- construction ----------
window.init = async (data) => {
  Object.assign(R, data);
  const cadre = document.getElementById('cadre');
  R.scenes.forEach((sc, k) => {
    sc.k = k; sc.a = R.scenes[k + 1]?.de ?? R.duree;
    const el = document.createElement('div');
    el.className = `scene ${sc.theme ?? 'papier'} ${sc.type}`; el.style.zIndex = k + 1;
    el.innerHTML = `<div class="fond"></div>${(sc.theme ?? 'papier') === 'encre' ? '<div class="faisceau"></div>' : ''}<div class="camera"><div class="contenu">${T[sc.type].construire(sc)}</div></div>`;
    if (['telephone', 'clip', 'plan'].includes(sc.type)) el.querySelector('.contenu').style.cssText = 'left:0;right:0;top:0;bottom:0;display:block';
    cadre.appendChild(el); sc.el = el;
  });
  await document.fonts.ready;
  R.scenes.forEach(sc => { sc.el.style.display = 'block'; T[sc.type].apres?.(sc.el, sc); });
  // mots montrés par une scène : leurs sous-titres sont inutiles (le texte EST le sous-titre)
  R.montres = R.scenes.map(sc => new Set(T[sc.type].montre?.(sc) ?? []));
};

// ---------- une image ----------
window.rendre = async (t) => {
  const ctx = { flouY: 0 };
  let k = R.scenes.findLastIndex(sc => sc.de <= t); if (k < 0) k = 0;
  R.scenes.forEach((sc, j) => {
    const el = sc.el, tr = TR[sc.transition ?? 'glisse'], suiv = R.scenes[j + 1], trs = suiv ? TR[suiv.transition ?? 'glisse'] : null;
    const visible = j === k || (suiv && j === k - 1 && t < suiv.de + (trs?.d ?? 0));
    el.style.display = visible ? 'block' : 'none';
    if (!visible) return;
    el.style.transform = ''; el.style.opacity = 1; el.style.clipPath = 'none';
    let flou = 0;
    el.dataset.entree = j === k && tr.d && j > 0 && t < sc.de + tr.d ? '1' : '';
    if (j === k && tr.d && j > 0) flou = tr.entree(el, prog(t, sc.de, tr.d));
    el.dataset.sortie = suiv && t >= suiv.de && trs?.d ? '1' : '';
    if (el.dataset.sortie) flou = trs.sortie(el, prog(t, suiv.de, trs.d));
    window.flou(el, `sc${j}`, flou, (el.dataset.sortie ? trs : tr)?.axe ?? 'y');
    // caméra : poussée lente continue (jamais d'image figée), secousse amortie sur les impacts
    const cam = el.querySelector('.camera'), p = prog(t, sc.de, sc.a - sc.de);
    let sx = 0, sy = 0; const ti = T[sc.type].impact?.(sc);
    if (ti != null && t >= ti) { const u = t - ti, a = 9 * Math.exp(-u / .07); sx = a * Math.sin(u * 95); sy = a * Math.cos(u * 77); }
    // caméra à l'épaule : dérive lente + micro-tremblement, plus présente sur les images réelles
    const main = sc.main ?? (sc.type === 'plan' ? 1 : .45);
    const hx = main * (7 * bruit(t * .55, 1) + 2.2 * bruit(t * 3.1, 2)), hy = main * (6 * bruit(t * .5, 3) + 2 * bruit(t * 2.9, 4));
    const hr = main * .22 * bruit(t * .4, 5);
    // coup de zoom sur les mots forts (reel.punch) : arrive en ~60 ms, se relâche en ~0,5 s
    let pz = 0; for (const tp of R.punch ?? []) { const u = t - tp; if (u >= 0 && u < 1.2) pz += .055 * (1 - Math.exp(-u / .03)) * Math.exp(-u / .32); }
    cam.style.transform = `translate(${sx + hx}px, ${sy + hy - 18 * E.doux(p)}px) rotate(${hr}deg) scale(${1 + (sc.poussee ?? .045) * E.doux(p) + pz})`;
    T[sc.type].animer(el, sc, t, ctx);
  });
  // clips : attendre que l'image du moment soit décodée
  for (const sc of R.scenes) if (sc.el.style.display === 'block' && T[sc.type].charger) await T[sc.type].charger(sc.el, sc, t);
  sousTitres(t, R.scenes[k]);
  appelAction(t);
  const f = Math.floor(t * R.fps); grain.style.transform = `translate(${-(f * 37 % 64)}px, ${-(f * 53 % 64)}px)`;
};

// CTA en surimpression : arrive doucement, reste lisible, repart avant la fin pour que la boucle reste propre
function appelAction(t) {
  const el = document.getElementById('cta'), c = R.cta;
  if (!c) { el.style.display = 'none'; return; }
  const a = c.de, b = c.a ?? Math.min(R.duree - .4, a + 2.4);
  if (t < a || t > b) { el.style.display = 'none'; return; }
  const u = Math.min(E.expo(prog(t, a, .45)), 1 - E.doux(prog(t, b - .35, .35)));
  el.style.display = 'flex'; el.style.opacity = u; el.style.transform = `translateY(${(1 - u) * 30}px)`;
  el.querySelector('.pilule').textContent = (c.texte ?? 'Envoie-nous un message') + ' →';
}

function sousTitres(t, sc) {
  const st = document.getElementById('st'), l = st.firstChild;
  if (R.sansSousTitres || !R.mots.length || ['fin', 'couverture'].includes(sc?.type)) { st.style.display = 'none'; return; }
  // mots montrés par une scène visible (y compris celle qui sort) ; pendant une transition, pas de sous-titre
  const vis = R.scenes.filter(x => x.el.style.display === 'block');
  if (vis.some(x => x.el.dataset.entree || x.el.dataset.sortie)) { st.style.display = 'none'; return; }
  // … et ceux de la scène précédente : après une coupe franche, la fin de sa phrase ne revient pas en sous-titre
  const montres = new Set([...vis.flatMap(x => [...R.montres[x.k]]), ...(R.montres[sc.k - 1] ?? [])]);
  const i = R.mots.findIndex(m => t < m.end + .05) ;
  const cur = i < 0 ? R.mots.length - 1 : i;
  const g = R.mots[cur].g, groupe = R.mots.map((m, j) => [m, j]).filter(([m]) => m.g === g);
  const debut = groupe[0][0].start - .08, fin = groupe.at(-1)[0].end + .25;
  // un groupe dont la phrase a fini avant cette scène ne la déborde jamais
  const fini = groupe.at(-1)[0].end < sc.de + .02;
  if (t < debut || t > fin || fini || groupe.some(([, j]) => montres.has(j))) { st.style.display = 'none'; return; }
  st.style.display = 'flex';
  st.className = ['plan', 'clip'].includes(sc.type) ? 'image' : (sc.theme ?? 'papier') === 'encre' ? 'sombre' : 'clair';
  // Chaque mot n'apparaît qu'au moment où il est dit (sa place est réservée : la ligne ne saute pas) ; il arrive
  // avec 0,08 s d'avance seulement, sinon l'œil le lit AVANT que la voix le dise.
  l.innerHTML = groupe.map(([m, j]) => {
    const u = t - (m.start - .08), on = u >= 0, s = on ? 1 + .07 * Math.max(0, 1 - ressort(u, 3.4, 1)) : 1;
    const op = on ? Math.min(1, u / .05) : 0;
    return `<span class="w on" style="opacity:${op.toFixed(2)};transform:scale(${s.toFixed(3)})">${fr(m.w.replace(/["“”]/g, ''))}</span>`;
  }).join(' ');
}

// ---------- contrôle : texte hors zone sûre, texte trop petit ----------
window.audit = () => {
  const pb = [];
  document.querySelectorAll('.scene, #st').forEach(s => {
    if (getComputedStyle(s).display === 'none' || s.dataset.sortie || s.dataset.entree) return;   // une scène en transition a le droit de déborder
    s.querySelectorAll('.bloc, .label, .sous, .ligne, .txt, .item, .cta, .pseudo, .wordmark, .val').forEach(e => {
      const r = e.getBoundingClientRect(), fs = parseFloat(getComputedStyle(e).fontSize), op = +getComputedStyle(e).opacity;
      if (!r.width || op === 0 || !e.textContent.trim()) return;
      if (fs < 34) pb.push(`texte < 34 px (${fs}px) : ${e.textContent.trim().slice(0, 30)}`);
      if (e.closest('.tel')) return;
      if (r.top < 200 || r.bottom > 1720 || r.left < 40 || r.right > 1040) pb.push(`hors zone sûre (${Math.round(r.left)},${Math.round(r.top)}–${Math.round(r.right)},${Math.round(r.bottom)}) : ${e.textContent.trim().slice(0, 30)}`);
    });
  });
  return pb;
};
</script>
</body>
</html>
