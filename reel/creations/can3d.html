<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden}
body{width:1080px;height:1920px;position:relative;background:#141210}
canvas{position:absolute;inset:0}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="importmap">{"imports":{"three":"file:///home/user/brooze-agent/node_modules/three/build/three.module.js","three/addons/":"file:///home/user/brooze-agent/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Plan 3D du hook (Reel Red Bull) : canette GÉNÉRIQUE (graphite, bande cuivre, aucune marque), contre-plongée qui se
// redresse en vue de face (raccord avec la canette 2D du début et de la fin), balayage de lumière, buée.
// Déterministe : tout dépend de t. window.renderAt(t) ; window.CHAMP.dur = durée du plan.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const P = Object.assign({ dur: 3.4 }, window.CHAMP || {});
const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(1080, 1920, false);
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.0; R.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#141210'); scene.fog = new THREE.Fog('#141210', 14, 46);
const pm = new THREE.PMREMGenerator(R);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.28;
const cam = new THREE.PerspectiveCamera(30, 1080 / 1920, .1, 100);

// profil de révolution (rayon, hauteur) : corps, épaule, goulot, bord
const H = 6.0, Rr = 1.0;
const prof = [[0.0, 0], [.86, 0], [.93, .035], [.98, .09], [Rr, .16], [Rr, H - 1.0], [.985, H - .9], [.93, H - .7], [.86, H - .52], [.80, H - .36], [.80, H - .1],
  [.835, H - .075], [.835, H - .035], [.80, H], [.0, H]].map(([r, y]) => new THREE.Vector2(r, y));
const geo = new THREE.LatheGeometry(prof, 128);
const metal = new THREE.MeshPhysicalMaterial({ color: '#3a3733', metalness: 1, roughness: .32, clearcoat: .6, clearcoatRoughness: .18, envMapIntensity: 1.3 });
const can = new THREE.Group(); scene.add(can);
can.add(new THREE.Mesh(geo, metal));
// bande cuivre (légèrement en relief)
const bandG = new THREE.CylinderGeometry(Rr + .006, Rr + .006, .44, 128, 1, true);
const band = new THREE.Mesh(bandG, new THREE.MeshPhysicalMaterial({ color: '#b87333', metalness: 1, roughness: .28, clearcoat: .5, clearcoatRoughness: .15 }));
band.position.y = H * 0.40; can.add(band);
// dessus aluminium + languette
const topM = new THREE.MeshPhysicalMaterial({ color: '#cfcac2', metalness: 1, roughness: .22 });
const lid = new THREE.Mesh(new THREE.CircleGeometry(.80, 96), topM); lid.rotation.x = -Math.PI / 2; lid.position.y = H + .001; can.add(lid);
const rim = new THREE.Mesh(new THREE.TorusGeometry(.815, .028, 24, 128), topM); rim.rotation.x = Math.PI / 2; rim.position.y = H - .03; can.add(rim);
const tab = new THREE.Mesh(new THREE.TorusGeometry(.2, .035, 16, 48), topM); tab.rotation.x = -Math.PI / 2; tab.scale.set(1, 1.5, 1); tab.position.set(0, H + .02, .15); can.add(tab);
// buée : gouttes (déterministes)
const dm = new THREE.MeshPhysicalMaterial({ color: '#ffffff', metalness: 0, roughness: .04, transmission: 1, ior: 1.33, thickness: .05, transparent: true });
let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 160; i++) {
  const a = rnd() * Math.PI * 2, y = .5 + rnd() * (H - 2.2), r = .012 + rnd() * rnd() * .035;
  const d = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), dm); d.scale.set(1, 1 + rnd() * .7, .6);
  d.position.set(Math.sin(a) * (Rr + .004), y, Math.cos(a) * (Rr + .004)); d.lookAt(d.position.clone().multiplyScalar(2).setY(y)); can.add(d);
}
// sol réfléchissant sombre
const floor = new THREE.Mesh(new THREE.CircleGeometry(80, 64), new THREE.MeshStandardMaterial({ color: '#0e0c0b', roughness: .38, metalness: .6 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -.001; // pas de sol visible : le fond reste celui du 2D
// lumières : contre-jour cuivre + clé qui balaie
const rimL = new THREE.DirectionalLight('#ffb070', 3.2); rimL.position.set(-8, 8, -10); scene.add(rimL);
const key = new THREE.SpotLight('#fff1e0', 380, 80, .5, .8, 1.6); scene.add(key); scene.add(key.target); key.target.position.set(0, 3, 0);
const fill = new THREE.PointLight('#6a8cff', 30, 40, 1.5); fill.position.set(9, 4, 7); scene.add(fill);
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
window.renderAt = t => {
  const u = ease(t / P.dur), w = t / P.dur;
  const elev = THREE.MathUtils.lerp(-.30, 0.03, u);            // contre-plongée -> face
  const dist = THREE.MathUtils.lerp(16.4, 23.6, u);
  const yaw = Math.sin(w * Math.PI) * .45 * (1 - u * .35);     // un peu de côté puis retour de face
  cam.position.set(Math.sin(yaw) * dist * Math.cos(elev), 2.9 + Math.sin(elev) * dist, Math.cos(yaw) * dist * Math.cos(elev));
  cam.lookAt(Math.sin(yaw) * dist * .0, THREE.MathUtils.lerp(2.3, 2.9, u), 0);
  can.rotation.y = 0;
  const sw = ease((t - .15) / (P.dur * .85));                  // balayage de la clé de gauche à droite
  key.position.set(THREE.MathUtils.lerp(-9, 8, sw), 7, 9);
  key.intensity = 380 * (.55 + .45 * Math.sin(Math.PI * Math.min(1, sw * 1.05)));
  R.render(scene, cam);
};
window.pret = true;
</script>
