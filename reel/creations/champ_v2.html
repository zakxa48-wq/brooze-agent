<script type="module">
// v2 (23/10, objectif « engager et boucler ») : relances de caméra calées sur la voix (beats), vagues de cartes sur
// les mots clés (pulses), poussières au premier plan (profondeur), fin qui revient à l'image 1 (boucle parfaite).
// Champ de cartes : une carte se duplique (accumulation exponentielle), la caméra recule, puis toutes se retournent en vague.

import * as THREE from 'three';
const P = Object.assign({ tboucle: 0, nmax: 2400, tb: 4.9, tfin: 34.0, tflip: 40.0, tplonge: 42.5, tvague: 22.5, env: [], beats: [], pulses: [], tunflip: 1e9, tsolo: 1e9, dfin: 3.1 }, window.CHAMP || {});

g.setAttribute('iSeed', new THREE.InstancedBufferAttribute(seed, 1)); g.setAttribute('iRad', new THREE.InstancedBufferAttribute(rad, 1));

  side: THREE.DoubleSide, uniforms: U,
  vertexShader: `
  attribute vec3 iPos; attribute float iBirth, iSeed, iRad;
  uniform float uT, uFlip, uVague, uUnflip, uSolo, uTf; uniform vec3 uPulse[12];
  varying vec2 vUv; varying float vSeed, vHero, vShade, vGlow, vDepth, vF;
  float ease(float x){x=clamp(x,0.,1.);return 1.-pow(1.-x,3.);}
  float sm(float x){x=clamp(x,0.,1.);return x*x*(3.-2.*x);}
  void main(){

    vec3 target=iPos*e; target.z+=sin(clamp(age,0.,1.)*3.14159)*1.6;
    // petit flottement propre à chaque carte
    target.z+=.08*sin(uTf*.9+iSeed*40.)*e; target.xy+=.05*vec2(sin(uTf*.7+iSeed*17.),cos(uTf*.6+iSeed*23.))*e;   // uTf : temps de boucle
    // anneau de partage qui traverse le champ
    float ring=0.; if(uT>uVague){float ph=(uT-uVague); float rr=mod(ph*7.5,26.); ring=exp(-pow((iRad-rr)*.38,2.))*step(ph,12.)*e;}
    // vagues sur les mots clés : un groupe de cartes se soulève et s'éclaire autour d'un point, puis se repose
    float pz=0.; for(int k=0;k<12;k++){ float u=uT-uPulse[k].z; if(u>0.&&u<1.6){ float dd=length(iPos.xy-uPulse[k].xy);
      float onde=exp(-pow((dd-u*9.)*.45,2.))*exp(-u*1.6); pz+=onde; } }
    ring+=pz*.8; vGlow=ring; target.z+=ring*1.3;
    float sc=mix(.25,1.,sm(age*1.4))*(1.+ring*.12)*alive;
    sc*=1.-sm(uSolo)*(1.-vHero);   // fin : tout s'efface, il ne reste que la carte du début
    // retournement en vague depuis le centre
    float f=sm((uT-uFlip-min(iRad,38.)*.032)/.95); f*=1.-vHero*sm((uT-uUnflip)/.8); vF=f;   // la carte héros se retourne à nouveau : boucle

    float c=cos(ang),s=sin(ang); p=vec3(p.x*c,p.y,-p.x*s);

  fragmentShader: `
  precision highp float;
  uniform float uT; uniform float uHist[12];
  varying vec2 vUv; varying float vSeed, vHero, vShade, vGlow, vDepth, vF;
  float hash(float n){return fract(sin(n*91.3458)*47453.5453);}
  float sdRB(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
  void main(){
    float vS=floor(vSeed*4096.+.5)/4096.;
    vec2 p=(vUv-.5)*vec2(1.,1.4); float d=sdRB(p,vec2(.5,.7),.09);
    if(d>0.) discard;
    float edge=smoothstep(0.,-.012,d);
    vec3 paper=vec3(.969,.965,.949), studio=vec3(.843,.839,.827), ink=vec3(.063,.055,.051), soft=vec3(.42,.404,.373), cu=vec3(.784,.514,.29);
    vec3 col;

      col=mix(col,soft,step(length(p-vec2(-.34,.56)),.045));
      col=mix(col,studio,step(abs(p.y-.56),.018)*step(-.26,p.x)*step(p.x,.18));
      // barres d'égaliseur pilotées par la voix
      float bx=(p.x+.36)/.72; float k=floor(bx*8.);
      if(bx>0.&&bx<1.){
        float fx=fract(bx*8.); int ki=int(clamp(k,0.,7.)); float hv=uHist[ki];
        float h=.1+.62*clamp(hv*(.55+.6*hash(vS*50.+k)),0.,1.);
        float inBar=step(.14,fx)*step(fx,.86)*step(-.36,p.y)*step(p.y,-.36+h*.8);
        vec3 bc=mix(ink,soft,vHero>.5?0.:.4); if(vHero>.5&&k==5.) bc=cu;
        col=mix(col,bc,inBar);
      }
      // lignes de texte abstraites
      for(int i=0;i<3;i++){float y=-.5-float(i)*.07; float w=.5-float(i)*.13-hash(vS*9.+float(i))*.1;
        col=mix(col,studio,step(abs(p.y-y),.014)*step(-.36,p.x)*step(p.x,-.36+w));}
    } else {
      vec3 tone=vS<.34?studio:(vS<.67?vec3(.91,.9,.88):vec3(.78,.77,.75));
      col=mix(tone,tone*.88,smoothstep(-.6,.7,p.y));
      vec3 sil=vHero>.5?cu:mix(ink,soft,hash(vS*7.)*.55);
      float head=step(length((p-vec2(0.,.14))*vec2(1.,1.)),.17);
      vec2 q=(p-vec2(0.,-.42))/vec2(.36,.30); float body=step(length(q),1.);
      col=mix(col,sil,max(head,body));
    }
    // reflet qui glisse + éclat de l'anneau
    float sheen=smoothstep(.07,0.,abs(p.x*.8+p.y*.6-.55*sin(uT*.35+vS*6.)));
    col+=sheen*.06; col+=vGlow*vec3(.1,.08,.05);
    col*=vShade*(.82+.3*hash(vS*3.7+1.))*exp(-vDepth*.0065);
    col=mix(col,col*.55,smoothstep(-.012,0.,d)*.6);
    gl_FragColor=vec4(col,1.);
  }`
});
const mesh = new THREE.InstancedMesh(g, mat, N); mesh.frustumCulled = false;
// l'instanciation passe par les attributs : une matrice identité suffit
mesh.count = N; scene.add(mesh);
const sm = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
// couche de premier plan : poussières chaudes, floues et lentes, attachées à la caméra (profondeur, jamais devant le texte)
const NP = 90, pp = new Float32Array(NP * 3), ps = new Float32Array(NP);
for (let i = 0; i < NP; i++) { const h = k => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
  pp.set([(h(1) - .5) * 3.2, (h(2) - .5) * 5.6, -1.2 - h(3) * 4.5], i * 3); ps[i] = h(4); }
const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pp, 3)); pg.setAttribute('aS', new THREE.BufferAttribute(ps, 1));
const UP = { uT: { value: 0 }, uA: { value: 1 } };
const pmat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.NormalBlending, uniforms: UP,
  vertexShader: `attribute float aS; uniform float uT; varying float vA;
    void main(){ vec3 p=position; p.x+=.25*sin(uT*.21+aS*31.); p.y+=mod(uT*.05*(.4+aS)+aS*6.,5.6)-2.8+position.y*0.;
      vec4 mv=modelViewMatrix*vec4(p,1.); gl_Position=projectionMatrix*mv; gl_PointSize=(60.+140.*aS)/-mv.z; vA=.05+.05*aS; }`,
  fragmentShader: `uniform float uA; varying float vA; void main(){ float d=length(gl_PointCoord-.5); float a=vA*uA*smoothstep(.5,0.,d)*1.6; if(a<.003) discard; gl_FragColor=vec4(vec3(1.,.86,.7),a); }` });
const pts = new THREE.Points(pg, pmat); pts.frustumCulled = false; cam.add(pts); scene.add(cam);
// relances de caméra sur la voix : chaque beat déplace le cadrage pour de bon (ressort amorti, sans à-coup)
const ress = u => { if (u <= 0) return 0; const w = 2 * Math.PI * 1.9, z = .72, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + z * w / wd * Math.sin(wd * u)); };
function beats(t) { const o = { d: 0, az: 0, el: 0, roll: 0, tx: 0, ty: 0 };
  for (const b of P.beats) { const r = ress(t - b.t); if (!r) continue;
    if (b.k === 'pousse') o.d -= b.a * r; else if (b.k === 'recule') o.d += b.a * r; else if (b.k === 'pan') o.az += b.a * r;
    else if (b.k === 'tilt') o.el += b.a * r; else if (b.k === 'roulis') o.roll += b.a * r; else if (b.k === 'vise') { o.tx += b.a * r * (b.x ?? 1); o.ty += b.a * r * (b.y ?? 0); } }
  return o; }
function render(t) {
  const n = Math.max(1, Math.min(N, Math.exp(K * (t - P.tb)))), nn = t < P.tb ? 1 : n;
  for (let k = 0; k < 12; k++) { const i = Math.max(0, Math.round((t - k * .07) * 30)); hist[k] = P.env[i] ?? 0; }
  U.uT.value = t;
  // distance : suit la taille du champ, plafonnée pour garder des cartes lisibles
  let d = Math.min(31, Math.max(3.1, (S * Math.sqrt(nn - .99) * 1.12 + .72) / .205));
  d *= 1 - .1 * sm(t / P.tb);
  // boucle : dans la dernière seconde, le tremblé rejoint celui du tout début (t − tboucle → 0) : la dernière image = la première
  const jit = u => [.035 * Math.sin(u * 1.3) + .02 * Math.sin(u * 2.9), .03 * Math.sin(u * 1.1 + 1) + .015 * Math.sin(u * 3.3), .02 * Math.sin(u * .5), .012 * Math.sin(u * .4)];
  const wB = P.tboucle ? sm((t - (P.tboucle - 1.2)) / 1.2) : 0, j1 = jit(t), j0 = jit(t - P.tboucle), J = j1.map((v, k) => v * (1 - wB) + j0[k] * wB);

  cam.position.set(Math.sin(az) * Math.cos(el) * d + hx * d * .1, Math.sin(el) * d + hy * d * .1, Math.cos(az) * Math.cos(el) * d);
  cam.up.set(0, 1, 0); cam.lookAt(B.tx * lib, B.ty * lib, 0); cam.rotation.z += J[3] + B.roll * lib;
  R.render(scene, cam);
}
window.renderAt = t => { render(t); return true; }; window.pret = true;
</script>
