<script type="module">
// Champ de cartes : une carte se duplique (accumulation exponentielle), la caméra recule, puis toutes se retournent en vague.
// Déterministe : tout dépend de t. Paramètres (window.CHAMP, posés par le script de rendu) : nmax, tb (début des naissances),
// tfin (fin des naissances), tflip (début du retournement), tplonge (début de la plongée), env (enveloppe de voix, 30/s).
import * as THREE from 'three';
const P = Object.assign({ nmax: 2400, tb: 4.9, tfin: 34.0, tflip: 40.0, tplonge: 42.5, tvague: 22.5, env: [] }, window.CHAMP || {});
const N = P.nmax, S = 0.85, K = Math.log(N) / (P.tfin - P.tb);
const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(1080, 1920, false); R.setClearColor(0, 0);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(40, 1080 / 1920, .1, 600);
const g = new THREE.PlaneGeometry(1, 1.4);
const pos = new Float32Array(N * 3), birth = new Float32Array(N), seed = new Float32Array(N), rad = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const r = S * Math.sqrt(i), a = i * 2.39996323;
  pos.set([r * Math.cos(a), r * Math.sin(a), 0], i * 3);
  birth[i] = i === 0 ? -10 : P.tb + Math.log(i + 1) / K;
  const h = Math.sin(i * 127.1 + 311.7) * 43758.5453; seed[i] = h - Math.floor(h); rad[i] = r;
}
g.setAttribute('iPos', new THREE.InstancedBufferAttribute(pos, 3)); g.setAttribute('iBirth', new THREE.InstancedBufferAttribute(birth, 1));
g.setAttribute('iSeed', new THREE.InstancedBufferAttribute(seed, 1)); g.setAttribute('iRad', new THREE.InstancedBufferAttribute(rad, 1));
const hist = new Array(12).fill(0);
const U = { uT: { value: 0 }, uHist: { value: hist }, uFlip: { value: P.tflip }, uVague: { value: P.tvague } };
const mat = new THREE.ShaderMaterial({
  side: THREE.DoubleSide, uniforms: U,
  vertexShader: `
  attribute vec3 iPos; attribute float iBirth, iSeed, iRad;
  uniform float uT, uFlip, uVague;
  varying vec2 vUv; varying float vSeed, vHero, vShade, vGlow, vDepth, vF;
  float ease(float x){x=clamp(x,0.,1.);return 1.-pow(1.-x,3.);}
  float sm(float x){x=clamp(x,0.,1.);return x*x*(3.-2.*x);}
  void main(){
    vUv=uv; vSeed=iSeed; vHero=iRad<.001?1.:0.;
    float age=(uT-iBirth)/1.25; float alive=step(0.,age);
    float e=ease(age);
    vec3 target=iPos*e; target.z+=sin(clamp(age,0.,1.)*3.14159)*1.6;
    // petit flottement propre à chaque carte
    target.z+=.08*sin(uT*.9+iSeed*40.)*e; target.xy+=.05*vec2(sin(uT*.7+iSeed*17.),cos(uT*.6+iSeed*23.))*e;
    // anneau de partage qui traverse le champ
    float ring=0.; if(uT>uVague){float ph=(uT-uVague); float rr=mod(ph*7.5,26.); ring=exp(-pow((iRad-rr)*.38,2.))*step(ph,12.)*e;}
    vGlow=ring; target.z+=ring*1.3;
    float sc=mix(.25,1.,sm(age*1.4))*(1.+ring*.12)*alive;
    // retournement en vague depuis le centre
    float f=sm((uT-uFlip-min(iRad,38.)*.032)/.95); vF=f;
    float ang=f*3.14159265+(1.-e)*(3.14159*1.5)*(1.-vHero);
    vec3 p=vec3(position.xy*sc,0.);
    float c=cos(ang),s=sin(ang); p=vec3(p.x*c,p.y,-p.x*s);
    p.z+=sin(f*3.14159)*1.1;
    vec3 w=target+p; vec4 mv=modelViewMatrix*vec4(w,1.);
    vDepth=-mv.z; vShade=.8+.2*c*(f>.5?-1.:1.)*0.+.2*cos(ang);
    gl_Position=projectionMatrix*mv;
  }`,
  fragmentShader: `
  precision highp float;
  uniform float uT; uniform float uHist[12];
  varying vec2 vUv; varying float vSeed, vHero, vShade, vGlow, vDepth, vF;
  float hash(float n){return fract(sin(n*91.3458)*47453.5453);}
  float sdRB(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
  void main(){
    float vS=floor(vSeed*4096.+.5)/4096.;
    vec2 p=(vUv-.5)*vec2(1.,1.4); float d=sdRB(p,vec2(.5,.7),.09);
    if(d>0.) discard;
    float edge=smoothstep(0.,-.012,d);
    vec3 paper=vec3(.969,.965,.949), studio=vec3(.843,.839,.827), ink=vec3(.063,.055,.051), soft=vec3(.42,.404,.373), cu=vec3(.784,.514,.29);
    vec3 col;
    if(gl_FrontFacing){
      col=mix(paper,vec3(.93,.92,.9),smoothstep(.7,-.7,p.y)*.5);
      // en-tête : une pastille et deux traits
      col=mix(col,soft,step(length(p-vec2(-.34,.56)),.045));
      col=mix(col,studio,step(abs(p.y-.56),.018)*step(-.26,p.x)*step(p.x,.18));
      // barres d'égaliseur pilotées par la voix
      float bx=(p.x+.36)/.72; float k=floor(bx*8.);
      if(bx>0.&&bx<1.){
        float fx=fract(bx*8.); int ki=int(clamp(k,0.,7.)); float hv=uHist[ki];
        float h=.1+.62*clamp(hv*(.55+.6*hash(vS*50.+k)),0.,1.);
        float inBar=step(.14,fx)*step(fx,.86)*step(-.36,p.y)*step(p.y,-.36+h*.8);
        vec3 bc=mix(ink,soft,vHero>.5?0.:.4); if(vHero>.5&&k==5.) bc=cu;
        col=mix(col,bc,inBar);
      }
      // lignes de texte abstraites
      for(int i=0;i<3;i++){float y=-.5-float(i)*.07; float w=.5-float(i)*.13-hash(vS*9.+float(i))*.1;
        col=mix(col,studio,step(abs(p.y-y),.014)*step(-.36,p.x)*step(p.x,-.36+w));}
    } else {
      vec3 tone=vS<.34?studio:(vS<.67?vec3(.91,.9,.88):vec3(.78,.77,.75));
      col=mix(tone,tone*.88,smoothstep(-.6,.7,p.y));
      vec3 sil=vHero>.5?cu:mix(ink,soft,hash(vS*7.)*.55);
      float head=step(length((p-vec2(0.,.14))*vec2(1.,1.)),.17);
      vec2 q=(p-vec2(0.,-.42))/vec2(.36,.30); float body=step(length(q),1.);
      col=mix(col,sil,max(head,body));
    }
    // reflet qui glisse + éclat de l'anneau
    float sheen=smoothstep(.07,0.,abs(p.x*.8+p.y*.6-.55*sin(uT*.35+vS*6.)));
    col+=sheen*.06; col+=vGlow*vec3(.1,.08,.05);
    col*=vShade*exp(-vDepth*.0065);
    col=mix(col,col*.55,smoothstep(-.012,0.,d)*.6);
    gl_FragColor=vec4(col,1.);
  }`
});
const mesh = new THREE.InstancedMesh(g, mat, N); mesh.frustumCulled = false;
// l'instanciation passe par les attributs : une matrice identité suffit
mesh.count = N; scene.add(mesh);
const sm = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
function render(t) {
  const n = Math.max(1, Math.min(N, Math.exp(K * (t - P.tb)))), nn = t < P.tb ? 1 : n;
  for (let k = 0; k < 12; k++) { const i = Math.max(0, Math.round((t - k * .07) * 30)); hist[k] = P.env[i] ?? 0; }
  U.uT.value = t;
  // distance : suit la taille du champ, plafonnée pour garder des cartes lisibles
  let d = Math.min(44, Math.max(3.5, (S * Math.sqrt(nn - .99) * 1.12 + .72) / .205));
  d *= 1 - .1 * sm(t / P.tb);
  const plonge = sm((t - P.tplonge) / 5.4); d = Math.exp(Math.log(d) * (1 - plonge) + Math.log(3.6) * plonge);
  const el = (.46 * sm((t - 6) / 24)) * (1 - plonge) + .02 * Math.sin(t * .5);
  const az = (.3 * sm((t - 8) / 22) * Math.sin(t * .11 + .6)) * (1 - plonge);
  const hx = .035 * Math.sin(t * 1.3) + .02 * Math.sin(t * 2.9), hy = .03 * Math.sin(t * 1.1 + 1) + .015 * Math.sin(t * 3.3);
  cam.position.set(Math.sin(az) * Math.cos(el) * d + hx * d * .1, Math.sin(el) * d + hy * d * .1, Math.cos(az) * Math.cos(el) * d);
  cam.up.set(0, 1, 0); cam.lookAt(0, 0, 0); cam.rotation.z += .012 * Math.sin(t * .4);
  R.render(scene, cam);
}
window.renderAt = t => { render(t); return true; }; window.pret = true;
</script>
