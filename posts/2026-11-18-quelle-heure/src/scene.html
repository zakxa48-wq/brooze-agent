<script type="module">
// Scène unique : une tasse sur une table devant un mur. Seule la lumière change (paramètre ?l=matin|midi|soir|nuit).
import * as THREE from 'three';
import { RoomEnvironment } from 'file:///home/user/brooze-agent/node_modules/three/examples/jsm/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const L = q.get('l') || 'midi';
const W = +(q.get('w') || 1080), H = +(q.get('h') || 1080);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = +(q.get('env') || 0.12);

// Bruit déterministe pour le grain des matières
function rng(seed){ return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function texBruit(base, var_, size, seed, stries){
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  const r = rng(seed); const img = g.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++){
    let n = (r() - 0.5) * var_;
    if (stries) n += Math.sin(y * 0.09 + Math.sin(x * 0.013) * 6) * var_ * 0.5;
    const i = (y * size + x) * 4;
    img.data[i] = base[0] + n; img.data[i+1] = base[1] + n; img.data[i+2] = base[2] + n; img.data[i+3] = 255;
  }
  g.putImageData(img, 0, 0); const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}

// Table (bois clair mat, veinage discret) et mur (enduit papier)
const bois = texBruit([150, 118, 88], 6, 1024, 7, true); bois.repeat.set(1, 1); bois.rotation = 0.0;
const table = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ map: bois, roughness: 0.55 }));
table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);
const enduit = texBruit([214, 209, 200], 6, 512, 3, false); enduit.repeat.set(3, 3);
const mur = new THREE.Mesh(new THREE.PlaneGeometry(14, 8), new THREE.MeshStandardMaterial({ map: enduit, roughness: 0.95 }));
mur.position.set(0, 4, -2.2); mur.receiveShadow = true; scene.add(mur);

// Tasse : profil de révolution (paroi épaisse, lèvre arrondie)
const prof = [];
const pts = [[0,0],[0.42,0],[0.47,0.03],[0.50,0.12],[0.56,0.5],[0.62,0.95],[0.64,1.0],[0.62,1.02],[0.58,0.98],[0.53,0.55],[0.47,0.16],[0.0,0.14]];
pts.forEach(p => prof.push(new THREE.Vector2(p[0], p[1])));
const ceram = new THREE.MeshPhysicalMaterial({ color: 0xF2EFE8, roughness: 0.22, clearcoat: 0.6, clearcoatRoughness: 0.15 });
const tasse = new THREE.Mesh(new THREE.LatheGeometry(prof, 96), ceram);
tasse.castShadow = tasse.receiveShadow = true;
const groupe = new THREE.Group(); groupe.add(tasse);
// Anse
const anse = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.055, 24, 64, Math.PI * 1.25), ceram);
anse.position.set(0.66, 0.55, 0); anse.rotation.z = -Math.PI * 0.62; anse.castShadow = true; groupe.add(anse);
// Café
const cafe = new THREE.Mesh(new THREE.CircleGeometry(0.565, 96), new THREE.MeshPhysicalMaterial({ color: 0x2a1609, roughness: 0.08, clearcoat: 1 }));
cafe.rotation.x = -Math.PI / 2; cafe.position.y = 0.86; groupe.add(cafe);
// Mousse : anneau clair près du bord
const mousse = new THREE.Mesh(new THREE.RingGeometry(0.44, 0.565, 96), new THREE.MeshStandardMaterial({ color: 0x9c6b42, roughness: 0.6 }));
mousse.rotation.x = -Math.PI / 2; mousse.position.y = 0.861; groupe.add(mousse);
// Soucoupe
const sprof = [[0,0],[0.7,0],[0.9,0.04],[1.05,0.12],[1.08,0.14],[1.04,0.15],[0.88,0.09],[0.62,0.06],[0,0.06]].map(p => new THREE.Vector2(p[0], p[1]));
const soucoupe = new THREE.Mesh(new THREE.LatheGeometry(sprof, 96), ceram); soucoupe.castShadow = soucoupe.receiveShadow = true;
scene.add(soucoupe); groupe.position.y = 0.06; scene.add(groupe);
// Cuillère simple posée sur la soucoupe
const cuil = new THREE.Group();
const metal = new THREE.MeshStandardMaterial({ color: 0xcfcac2, metalness: 0.55, roughness: 0.35 });
const manche = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.018, 0.07), metal); manche.position.x = 0.45; cuil.add(manche);
const tete = new THREE.Mesh(new THREE.SphereGeometry(0.13, 32, 16), metal); tete.scale.set(1.3, 0.18, 0.85); cuil.add(tete);
cuil.position.set(0.25, 0.17, 0.72); cuil.rotation.y = -0.35; cuil.traverse(o => o.castShadow = true); scene.add(cuil);
// Deux sucres
const sucreM = new THREE.MeshStandardMaterial({ color: 0xF6F3EC, roughness: 0.9 });
[[-1.25, 0.95, 0.3], [-1.02, 1.25, -0.4]].forEach(([x, z, r]) => {
  const s = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), sucreM); s.position.set(x, 0.1, z); s.rotation.y = r;
  s.castShadow = s.receiveShadow = true; scene.add(s);
});

// Fenêtre hors champ : seulement son ombre (croisillons) se projette
const fenetre = new THREE.Group();
const montant = (w, h, x, y) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.08), new THREE.MeshBasicMaterial({ color: 0 })); m.position.set(x, y, 0); m.castShadow = true; fenetre.add(m); };
// cadre percé : 4 bandes extérieures larges + croisillon
montant(9, 3, 0, 4.1); montant(9, 3, 0, -4.1); montant(3, 5.2, -3.4, 0); montant(3, 5.2, 3.4, 0);
montant(0.12, 5.2, 0, 0); montant(4, 0.12, 0, 0.2);
fenetre.traverse(o => { if (o.material) o.material.colorWrite = false; o.material && (o.material.depthWrite = false); });

// Les quatre éclairages (la seule chose qui change)
const R = {
  matin: { el: 16, az: -58, col: 0xffe6cc, int: 2.4, amb: 0x7d95c4, ambI: 0.45, fen: true, expo: 0.85 },
  midi:  { el: 74, az: -15, col: 0xfffaf0, int: 3.0, amb: 0xd9e2ec, ambI: 0.55, fen: false, expo: 0.8 },
  soir:  { el: 7,  az: 60,  col: 0xff8a38, int: 3.2, amb: 0x5a4878, ambI: 0.22, fen: true, expo: 0.9 },
  nuit:  { lampe: true, col: 0xffa860, int: 3.4, amb: 0x18223c, ambI: 0.03, expo: 0.8 }
}[L];

scene.add(new THREE.HemisphereLight(R.amb, 0x3a2e24, R.ambI));
renderer.toneMappingExposure = R.expo;
if (!R.lampe) {
  const sol = new THREE.DirectionalLight(R.col, R.int);
  const el = THREE.MathUtils.degToRad(R.el), az = THREE.MathUtils.degToRad(R.az);
  const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  sol.position.copy(dir.clone().multiplyScalar(14)); sol.target.position.set(0, 0.5, 0); scene.add(sol.target);
  sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048); sol.shadow.radius = 3; sol.shadow.bias = -0.0004; sol.shadow.normalBias = 0.02;
  const c = sol.shadow.camera; c.left = c.bottom = -6; c.right = c.top = 6; c.near = 1; c.far = 40;
  scene.add(sol);
  if (R.fen) { fenetre.position.copy(dir.clone().multiplyScalar(6.5)); fenetre.lookAt(0, 0.6, 0); scene.add(fenetre); }
} else {
  const lampe = new THREE.PointLight(R.col, R.int, 0, 2);
  lampe.position.set(-1.3, 1.25, 1.6); lampe.castShadow = true; lampe.shadow.mapSize.set(2048, 2048); lampe.shadow.radius = 6; lampe.shadow.bias = -0.0005;
  scene.add(lampe);
}

const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
cam.position.set(2.0, 2.55, 6.3); cam.lookAt(-0.1, 0.75, 0);
cam.setViewOffset(W, H, 0, (H > W ? H * 0.17 : 0), W, H);
renderer.render(scene, cam);
window.FINI = true;
</script></body></html>
